defaults:
  - model: hifigan
  - writer: cometml
  - metrics: one_audio_target_metrics
  - datasets: one_audio
  - dataloader: one_audio
  - transforms: example_only_instance
  - _self_

gen_optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  betas: [0.8, 0.99]
  weight_decay: 0.01

disc_optimizer:
  _target_: torch.optim.AdamW
  lr: 2e-4
  betas: [0.8, 0.99]
  weight_decay: 0.01

gen_lr_scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.999

disc_lr_scheduler:
  _target_: torch.optim.lr_scheduler.ExponentialLR
  gamma: 0.999

loss_function:
  _target_: src.loss.HiFiGANLoss

trainer:
  log_step: 1

  # сколько эпох обучать
  n_epochs: 500

  # КЛЮЧЕВО: 1 шаг на эпоху (1 батч)
  epoch_len: 1

  device_tensors: ["wav", "gt_wav", "gt_melspec"]
  resume_from: null
  device: auto
  override: True
  monitor: "off"
  save_period: 50
  early_stop: ${trainer.n_epochs}
  save_dir: "saved_dir"
  seed: 1
  max_grad_norm: 10
  skip_oom: True